name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check scripts tests

      - name: Pytest
        run: pytest -q -m "not compose"

      - name: Validate canon
        run: python scripts/validate.py

  compose:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose up
        run: docker compose up --build -d --wait

      - name: Healthz and search
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8099/healthz
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8099/healthz", timeout=10) as resp:
              health = json.load(resp)
          assert health.get("ok") is True, health
          assert int(health.get("records") or 0) > 0, health
          for query, expected in (("Волга", "wd:Q626"), ("МВД", "foiv:mvd")):
              url = "http://127.0.0.1:8099/v1/search?" + urllib.parse.urlencode({"q": query})
              with urllib.request.urlopen(url, timeout=10) as resp:
                  payload = json.load(resp)
              assert expected in payload.get("ids", []), payload
          print("compose-smoke ok")
          PY

      - name: Compose down
        if: always()
        run: docker compose down -v

  publish:
    name: ghcr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          IMAGE=ghcr.io/unhexx/toponym
          docker build \
            --label "org.opencontainers.image.source=https://github.com/unhexx/toponym" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:CalVer" \
            .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:CalVer"

      - name: Public package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/toponym/visibility \
            -f visibility=public
