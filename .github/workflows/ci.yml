name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check scripts tests

      - name: Pytest
        run: pytest -q -m "not compose"

      - name: Validate canon
        run: python scripts/validate.py

  compose:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install "pytest>=8.0,<9"

      - name: Pytest compose smoke
        run: pytest tests/test_compose_smoke.py

  publish:
    name: ghcr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          IMAGE=ghcr.io/unhexx/toponym
          docker build \
            --label "org.opencontainers.image.source=https://github.com/unhexx/toponym" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:CalVer" \
            .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:CalVer"

      - name: Public package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/toponym/visibility \
            -f visibility=public
