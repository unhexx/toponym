name: Daily registry refresh

on:
  schedule:
    # 06:00 UTC ≈ 09:00 Europe/Moscow
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: daily.py
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Daily refresh
        run: python scripts/daily.py

      - name: Commit if there is a real diff
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No changes — skip commit (empty commit forbidden)."
            exit 0
          fi

          git add -u
          if [[ -d data/sources/runs ]]; then
            git add data/sources/runs/
          fi
          for p in data/sources/catalog.yaml data/curated knowledge CHANGELOG.md; do
            if [[ -e "$p" ]]; then
              git add -A "$p" || true
            fi
          done

          if git diff --cached --quiet; then
            echo "Staged empty — skip commit."
            exit 0
          fi

          N=0
          JOURNAL="data/sources/runs/${TODAY}.json"
          if [[ -f "$JOURNAL" ]]; then
            N=$(python -c "import json; print(json.load(open('$JOURNAL', encoding='utf-8')).get('records_upserted', 0))" || echo 0)
          fi

          if [[ "$N" -gt 0 ]]; then
            MSG="chore(data): daily refresh ${TODAY} (${N} records)"
          else
            MSG="chore(data): daily refresh ${TODAY} (0 records)"
          fi

          git commit -m "$MSG"
          git push origin HEAD:main
