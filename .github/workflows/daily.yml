name: Daily registry refresh

on:
  schedule:
    # 06:00 UTC ≈ 09:00 Europe/Moscow
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: check → sync → validate → journal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Daily refresh (DAILY_UPDATE mechanical path)
        id: refresh
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          AS_OF=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          mkdir -p data/sources/runs
          SYNC_JSON_ARGS=()

          set +e
          python scripts/check.py --json | tee /tmp/check.json
          CHECK_EXIT=$?
          set -e
          echo "check_exit=$CHECK_EXIT" >> "$GITHUB_OUTPUT"

          CHANGED=$(python -c "import json; print(int(json.load(open('/tmp/check.json')).get('changed_count') or 0))" || echo 0)
          echo "changed_count=$CHANGED" >> "$GITHUB_OUTPUT"

          if [[ "$CHECK_EXIT" -eq 10 ]]; then
            python -c "import json; src=json.load(open('/tmp/check.json', encoding='utf-8')).get('sources') or []; [print(s['id']) for s in src if isinstance(s, dict) and s.get('changed') and not (s.get('error') and s.get('blocking', True)) and s.get('id')]" > /tmp/changed-ids.txt
            mapfile -t CHANGED_IDS < /tmp/changed-ids.txt
            for src in "${CHANGED_IDS[@]}"; do
              python scripts/sync.py --source "$src" --apply --check-json /tmp/check.json | tee "/tmp/sync-${src}.json"
              SYNC_JSON_ARGS+=(--sync-json "/tmp/sync-${src}.json")
            done
            set +e
            python scripts/validate.py
            VAL=$?
            set -e
            echo "validate=$VAL" >> "$GITHUB_OUTPUT"
            if [[ "$VAL" -ne 0 ]]; then
              git checkout -- data || true
              echo "validate failed; reverted data/, no commit" >&2
              exit 1
            fi
            python scripts/index.py
          else
            echo "validate=skip" >> "$GITHUB_OUTPUT"
            if [[ "$CHECK_EXIT" -eq 2 ]]; then
              echo "check.py exit 2; skip sync, write journal" >&2
            fi
          fi

          python .github/scripts/write_run_journal.py \
            --today "$TODAY" \
            --as-of "$AS_OF" \
            --check-exit "$CHECK_EXIT" \
            --check-json /tmp/check.json \
            "${SYNC_JSON_ARGS[@]}"

          if [[ "$CHECK_EXIT" -eq 0 ]]; then
            python scripts/check.py --stamp --today "$TODAY"
          fi

      - name: Commit if there is a real diff
        env:
          TODAY: ${{ steps.refresh.outputs.today }}
        run: |
          set -euo pipefail
          TODAY=${TODAY:-$(date -u +%Y-%m-%d)}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No changes — skip commit (empty commit forbidden)."
            exit 0
          fi

          git add -u
          if [[ -d data/sources/runs ]]; then
            git add data/sources/runs/
          fi
          for p in data/sources/catalog.yaml data/curated knowledge CHANGELOG.md .github/scripts; do
            if [[ -e "$p" ]]; then
              git add -A "$p" || true
            fi
          done

          if git diff --cached --quiet; then
            echo "Staged empty — skip commit."
            exit 0
          fi

          N=0
          JOURNAL="data/sources/runs/${TODAY}.json"
          if [[ -f "$JOURNAL" ]]; then
            N=$(python -c "import json; print(json.load(open('$JOURNAL', encoding='utf-8')).get('records_upserted', 0))" || echo 0)
          fi

          if [[ "$N" -gt 0 ]]; then
            MSG="chore(data): daily refresh ${TODAY} (${N} records)"
          else
            MSG="chore(data): daily refresh ${TODAY} (0 records)"
          fi

          git commit -m "$MSG"
          git push origin HEAD:main
