name: Restore CHANGELOG

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-changelog
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore CHANGELOG from fa516fe + Unreleased note
        run: |
          set -euo pipefail
          git checkout fa516fe392bebc874f5cd24cb7a36275a0d0a19d -- CHANGELOG.md
          python3 <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          old = "### Changed\n- Known-ids Wikidata"
          new = (
              "### Changed\n"
              "- Daily 2026-10-02: GeoNames mods обновил координаты села Крым"
              " (`wd:Q4242873`, GeoNames `540259`) — upsert 1, deprecate 0."
              " Курсор `geonames-ru` → `2026-10-01`.\n"
              "- Known-ids Wikidata"
          )
          if old not in text:
              raise SystemExit("anchor missing")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("bytes", p.stat().st_size)
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No CHANGELOG diff"
            exit 0
          fi
          git commit -m "docs: restore full CHANGELOG (fix truncated Unreleased edit)"
          git push origin HEAD:main
