name: toponym

services:
  toponym:
    image: ghcr.io/unhexx/toponym:2026.09.13
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/knowledge:uid=10001,gid=10001,mode=0755
    ports:
      - "127.0.0.1:8099:8099"
    environment:
      TOPONYM_BIND: "0.0.0.0"
      TOPONYM_PORT: "8099"
      TOPONYM_DB: "/app/knowledge/registry.db"
      TOPONYM_ALLOW_NON_LOOPBACK: "1"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    restart: unless-stopped
