delete_policy: pointer
notes: >
  Указатель, не дамп SPARQL: python scripts/sync.py --source wikidata --apply
  ходит SPARQL VALUES по уже известным Q-id из всех seed-таблиц (города,
  субъекты, годонимы, МО, микротопонимы, агентства и остальные curated с wd),
  заполняет пустые lat/lon/geonames/oktmo/name_en/wd; новые Q-id не вставляет.
  JSON/CSV запроса в git не кладётся. detector.kind=none — daily changed не
  флипает. Массовая вставка улиц — scripts/seed_hodonyms.py (P31 улица Q79007 /
  бульвар Q54114 / проспект Q628179 / переулок Q1251403 / набережная Q537127,
  P17=Q159, не ГАР/ФИАС; покрытие Wikidata, не «все улицы России»). МО —
  scripts/seed_municipalities.py (P31 городской округ / муниципальный округ /
  район / поселение / внутригородское, не ОКТМО/ГАР и не все МО России).
  Q-id → колонка wd; ru/en label → name_ru/name_en; P625 → lat/lon как точки
  (DEC-GEO-001, без полигонов/GeoJSON). P1566/P764 стыкуют geonames/oktmo на
  существующей строке; insert gn:{id} запрещён (DEC-GN-001). Allowlist P31
  городов Q7930989 (не pop≥100k и не все 1126 городов России, ruwiki), сёл
  Q15078955/Q532 без хуторов Q5084 (не ГКГН), площадей Q174782, дорог Q34442
  и ЖД Q728937 ruwiki (не ПП № 928), гидронимов Q23397/Q4022 ruwiki (не ГКГН),
  оронимов Q8502/Q46831/Q8072/Q23442/Q34763. Указатели data/raw/wikidata/*-ru.sparql;
  JSON/CSV запроса в git не кладётся.
