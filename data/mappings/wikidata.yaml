source_id: wikidata
stable_id: "wd:{qid}"
fields:
  qid: wd
  label_ru: name_ru
  label_en: name_en
  P625_lat: lat
  P625_lon: lon
  P1566: geonames
  P764: oktmo
class_map:
  Q515: city
  Q532: village
  Q79007: hodonym
  Q174782: agoronym
  Q34442: dromonym
  Q13626398: municipality
filter:
  P17: Q159
  known_ids_only: true
delete_policy: pointer
notes: >
  Указатель, не дамп SPARQL: запросы только по уже известным Q-id из
  curated (VALUES), результат в git не кладётся. Q-id → колонка wd;
  ru/en label → name_ru/name_en; P625 → lat/lon как точки (DEC-GEO-001,
  без полигонов/GeoJSON). P1566/P764 стыкуют geonames/oktmo на существующей
  строке; insert gn:{id} запрещён (DEC-GN-001). detector.kind=none.
