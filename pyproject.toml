[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toponym"
version = "2026.09.13"
description = "Local registry of Russian toponyms and agencies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "frictionless>=5.18,<6",
  "jsonschema>=4.18,<5",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[project.scripts]
toponym-serve = "scripts.serve:main"
toponym-index = "scripts.index:main"
toponym-validate = "scripts.validate:main"
toponym-check = "scripts.check:main"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "compose: docker compose smoke (CI job compose; unit job uses -m 'not compose')",
]
